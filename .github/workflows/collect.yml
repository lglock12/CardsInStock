name: Collect prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

permissions:
  contents: write

concurrency:
  group: collect-prices
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Discover live retailer products
        run: python discover_sources.py
      - name: Collect current prices
        run: python collector.py
      - name: Collect eBay BIN market
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python collect_ebay.py
      - name: Enrich product images
        run: python enrich_images.py
      - name: Build mobile dashboard
        run: python build_dashboard.py
      - name: Commit observations and dashboard
        run: |
          git config user.name "cardsinstock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/discovered_sources.json data/latest.json data/ebay_latest.json data/history.jsonl docs/index.html docs/latest.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update price observations and dashboard"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
