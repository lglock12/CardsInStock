name: Collect prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches:
      - main
    paths:
      - 'matching.py'
      - 'collect_sold_detail.py'
      - 'collector_v2.py'
      - 'discover_sources.py'
      - 'discover_sources_v2.py'
      - 'collect_market.py'
      - 'collect_ebay_public.py'
      - 'enrich_market.py'
      - 'enrich_images.py'
      - 'build_dashboard_modern.py'
      - 'ebay_utils.py'
      - 'config/products.json'
      - 'config/product_details.json'
      - 'config/product_details_extra.json'
      - 'config/retailers.json'
      - 'config/discovery_retailers.json'
      - '.github/workflows/collect.yml'

permissions:
  contents: write

concurrency:
  group: cardsinstock-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Discover live retailer products
        run: python discover_sources_v2.py
      - name: Collect current prices
        run: python collector_v2.py
      - name: Collect eBay market via CollectAIO
        run: python collect_market.py
      - name: Extract sold market and freshness
        run: python enrich_market.py
      - name: Refresh live eBay BIN market
        env:
          EBAY_SOLD_API_KEY: ${{ secrets.EBAY_SOLD_API_KEY }}
        run: python collect_ebay_public.py
      - name: Enrich product images
        run: python enrich_images.py
      - name: Revalidate stored detailed sold comps
        env:
          SOLD_CLEAN_ONLY: "1"
        run: python collect_sold_detail.py
      - name: Build compact responsive dashboard
        run: python build_dashboard_modern.py
      - name: Commit observations and dashboard
        run: |
          git config user.name "cardsinstock-bot"
          git config user.email "actions@users.noreply.github.com"

          OUT=/tmp/cardsinstock-output
          rm -rf "$OUT"
          mkdir -p "$OUT/config" "$OUT/data" "$OUT/docs"
          cp config/discovered_sources.json config/collectaio_map.json "$OUT/config/"
          cp data/active_ebay_cache.json "$OUT/data/" 2>/dev/null || true
          cp data/latest.json data/ebay_latest.json data/market_latest.json data/history.jsonl data/sold_latest.json data/sold_history.jsonl "$OUT/data/"
          cp docs/index.html docs/latest.json "$OUT/docs/"

          git fetch origin main
          git reset --hard origin/main

          cp "$OUT/config/"* config/
          cp "$OUT/data/"* data/
          cp "$OUT/docs/"* docs/

          git add config/discovered_sources.json config/collectaio_map.json data/latest.json data/ebay_latest.json data/market_latest.json data/active_ebay_cache.json data/history.jsonl data/sold_latest.json data/sold_history.jsonl docs/index.html docs/latest.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Update price observations and dashboard"
            git push origin HEAD:main
          fi
