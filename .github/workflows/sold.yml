name: Collect detailed sold comps

on:
  workflow_dispatch:
  schedule:
    # 12:15 AM Central year-round. GitHub cron is UTC, so run both possible
    # UTC offsets and let the first step keep only the invocation that lands at
    # 00:15 in America/Chicago (CDT=05:15 UTC, CST=06:15 UTC).
    - cron: '15 5 * * *'
    - cron: '15 6 * * *'
  push:
    branches:
      - main
    paths:
      - 'matching.py'
      - 'collect_sold_detail.py'
      - 'build_dashboard_modern.py'
      - '.github/workflows/sold.yml'

permissions:
  contents: write

concurrency:
  group: cardsinstock-data
  cancel-in-progress: false

jobs:
  sold:
    runs-on: ubuntu-latest
    steps:
      - name: Check Central Time schedule
        id: central
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LOCAL_TIME="$(TZ=America/Chicago date +'%H:%M')"
          echo "Central time is $LOCAL_TIME"
          if [ "$LOCAL_TIME" = "00:15" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.central.outputs.run == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        if: steps.central.outputs.run == 'true'
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
        if: steps.central.outputs.run == 'true'
      - name: Collect detailed eBay sold transactions
        if: steps.central.outputs.run == 'true'
        env:
          EBAY_SOLD_API_KEY: ${{ secrets.EBAY_SOLD_API_KEY }}
          SOLD_CLEAN_ONLY: ${{ github.event_name == 'push' && '1' || '0' }}
        run: python collect_sold_detail.py
      - name: Rebuild dashboard with sold comps
        if: steps.central.outputs.run == 'true'
        run: python build_dashboard_modern.py
      - name: Commit sold history and dashboard
        if: steps.central.outputs.run == 'true'
        run: |
          git config user.name "cardsinstock-bot"
          git config user.email "actions@users.noreply.github.com"

          OUT=/tmp/cardsinstock-sold-output
          rm -rf "$OUT"
          mkdir -p "$OUT/data" "$OUT/docs"
          cp data/sold_latest.json data/sold_history.jsonl "$OUT/data/"
          cp docs/index.html "$OUT/docs/"

          git fetch origin main
          git reset --hard origin/main

          cp "$OUT/data/"* data/
          cp "$OUT/docs/"* docs/

          git add data/sold_latest.json data/sold_history.jsonl docs/index.html
          if git diff --cached --quiet; then
            echo "No sold-data changes"
          else
            git commit -m "Update detailed eBay sold comps"
            git push origin HEAD:main
          fi
